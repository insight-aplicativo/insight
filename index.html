<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Favicon -->
 
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">

<!-- Apple -->

<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

<!-- Android / PWA -->

<link rel="manifest" href="/manifest.webmanifest">

<!-- Cores do navegador -->

<meta name="theme-color" content="#0f172a">
<meta name="application-name" content="INSIGHT">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSIGHT</title>
<style>
:root {
  --bg:#1b1d20;
  --bg2:#26292e;
  --bg3:#31353b;
  --fg:#fff;
  --mut:#a9afb8;
  --g:#10b981;
  --gd:#1f9e0a;
  --hd:#14161899;
  --bd:#3a3f46;
  --bd2:#444;
  --fab:#141618f0
}
* {
  box-sizing:border-box;
  margin:0
}
body {
  font-family:"Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--fg);
  padding-bottom:80px
}
button,input,select,textarea {
  font:inherit
}
a {
  color:var(--g)
}
.btn {
  background:var(--g);
  color:#111;
  border:0;
  padding:10px 18px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.2s
}
.btn:hover {
  box-shadow:0 0 16px var(--g);
  transform:translateY(-1px)
}
.btn.o {
  background:none;
  color:var(--g);
  border:1px solid var(--g)
}
.btn.r {
  background:#444850;
  color:#fff;
  border:1px solid #555b66
}
.btn.r:hover {
  background:#525863;
  box-shadow:0 0 12px rgba(255,255,255,0.1)
}
.btn.s {
  padding:5px 11px;
  font-size:.85rem
}
input,select,textarea {
  width:100%;
  background:var(--bg3);
  border:1px solid var(--bd2);
  color:var(--fg);
  padding:10px;
  border-radius:10px;
  margin:4px 0 10px
}
input:focus,select:focus,textarea:focus {
  outline:0;
  border-color:var(--g);
  box-shadow:0 0 0 2px #39ff1433
}
input[readonly],textarea[readonly] {
  opacity:.6
}
input[type=checkbox] {
  width:auto;
  margin-right:6px
}
label {
  font-size:.85rem;
  color:var(--mut)
}
header {
  position:sticky;
  top:0;
  z-index:50;
  background:var(--hd);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--g);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 20px
}
header img {
  height:44px;
  cursor:pointer;
  border-radius:12px
}
header.hc {
  display:grid;
  grid-template-columns:1fr auto 1fr
}
header.hc .menu {
  justify-self:end
}
.menu {
  position:relative
}
#optbtn { position:relative; }
#optbtn .dot {
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#e53935;
  top:3px;
  right:3px;
  border:1px solid var(--bg2);
  box-sizing:border-box;
}
.drop {
  display:none;
  position:absolute;
  right:0;
  top:46px;
  background:var(--bg2);
  border:1px solid var(--g);
  border-radius:12px;
  min-width:230px;
  overflow:hidden;
  box-shadow:0 10px 30px #000a
}
.drop.on {
  display:block
}
.drop a {
  display:block;
  padding:11px 16px;
  color:var(--fg);
  text-decoration:none;
  cursor:pointer
}
.drop a:hover {
  background:var(--g);
  color:#111
}
.drop a{display:flex;align-items:center;gap:11px}
.menu-ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.88}
.wrap {
  max-width:1150px;
  margin:20px auto;
  padding:0 16px;
  display:grid;
  grid-template-columns:1fr 290px;
  gap:20px
}
.wrap.one {
  grid-template-columns:1fr
}
.box {
  background:var(--bg2);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  border:1px solid var(--bd)
}
.idea {
  border-left:4px solid var(--g)
}
.idea h3 {
  color:var(--g);
  margin-bottom:6px
}
.meta {
  color:var(--mut);
  font-size:.82rem;
  margin:6px 0
}
.badge {
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  font-size:.78rem;
  font-weight:700;
  color:#111
}
.s-rascunho { background:#888 }
.s-pendente,.s-avaliacao-inicial,.s-avaliacao-de-negocio { background:#a6ffa0 }
.s-aguardando { background:#ffd93b }
.s-implantacao { background:#1b8a3a; color:#fff }
.s-implantada { background:#2f80ff; color:#fff }
.s-reprovada { background:#e53935; color:#fff }

.act button {
  background:none;
  border:1px solid var(--bd2);
  color:var(--fg);
  border-radius:20px;
  padding:4px 12px;
  cursor:pointer;
  margin-right:6px
}
.act button.on {
  border-color:var(--g);
  color:var(--g)
}
.reaction-icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:5px;color:currentColor}.reaction-svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.act button{display:inline-flex;align-items:center;gap:2px}
.cm {
  background:var(--bg3);
  border-radius:10px;
  padding:8px 12px;
  margin:6px 0;
  font-size:.9rem
}
.cm small {
  color:var(--mut)
}
.row {
  display:flex;
  gap:8px
}
.row input {
  margin-bottom:0
}
.av {
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--bg3);
  color:var(--fg);
  border:1px solid var(--bd2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  letter-spacing:.02em;
  flex:none;
  box-shadow:inset 0 0 0 2px var(--bg2)
}
.avatar-sm{display:inline-flex;vertical-align:middle;margin-right:6px}
.idea-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.idea-tags span{font-size:.75rem;padding:3px 8px;border:1px solid var(--bd2);border-radius:12px;color:var(--mut)}
.userline{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.idea-author{display:flex;align-items:center;gap:8px;margin:8px 0 10px;color:var(--mut);font-size:.9rem}
.idea-author .avatar-sm{margin-right:0}
.userline>span:last-child{min-width:0}\n.date-wrap{display:inline-block;max-width:100%;overflow-wrap:anywhere;word-break:break-word}
.meta{overflow-wrap:anywhere;word-break:break-word}
input[type=date]{max-width:100%;min-width:0}
.ideas-tabs{display:flex;flex-wrap:wrap;gap:8px}
.sc {
  display:flex;
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #3a3f46
}
.sc b {
  margin-left:auto;
  color:var(--g)
}
.car {
  position:relative;
  height:260px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:12px
}
.car img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:.8s
}
.car img.on {
  opacity:1
}
.car button {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:#000a;
  color:var(--g);
  border:0;
  font-size:1.6rem;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  padding:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.4)
}
.car button span {
  display:inline-block;
  margin-top:-3px
}
.dots {
  position:absolute;
  bottom:10px;
  width:100%;
  text-align:center
}
.dots i {
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff6;
  margin:0 4px;
  cursor:pointer
}
.dots i.on {
  background:var(--g)
}
.quote {
  text-align:center;
  font-style:italic;
  color:var(--mut);
  padding:8px 0 18px
}
.fab {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--fab);
  border-top:1px solid var(--g);
  padding:12px;
  text-align:center;
  z-index:40
}
#modal {
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:90;
  overflow:auto;
  padding:20px
}
#modal.on {
  display:block
}
#modal>div {
  max-width:560px;
  margin:auto;
  background:var(--bg2);
  border:1px solid var(--g);
  border-radius:18px;
  padding:22px
}
.login {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:radial-gradient(circle at 20% 10%,#1f3a1a,var(--bg) 55%)
}
.login .box {
  width:100%;
  max-width:400px;
  text-align:center
}
.login img {
  height:70px;
  margin-bottom:10px;
  border-radius:12px
}
.cta {
  display:block;
  margin-top:14px;
  padding:13px;
  border-radius:30px;
  background:linear-gradient(90deg,var(--g),#b6ff3b);
  color:#111;
  font-weight:800;
  text-decoration:none;
  box-shadow:0 0 22px #39ff1466
}
.doc {
  max-width:800px;
  margin:30px auto;
  padding:20px;
  line-height:1.7
}
.doc h1,.doc h2 {
  color:var(--g);
  margin:18px 0 8px
}
.board {
  display:grid;
  grid-template-columns:repeat(5,minmax(220px,1fr));
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px
}
.lane {
  background:var(--bg2);
  border-radius:14px;
  padding:10px;
  min-height:200px
}
.lane h4 {
  color:var(--g);
  margin-bottom:8px
}
.kc {
  background:var(--bg3);
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
  border-left:5px solid;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none
}
.kc .kh {
  float:right;
  margin:-4px -2px 0 8px;
  padding:2px 6px;
  color:var(--mut);
  font-size:1.1rem;
  line-height:1;
  touch-action:none;
  cursor:grab
}
.kc.dragging {
  opacity:.3
}
.kfloat {
  position:fixed;
  z-index:3000;
  margin:0;
  pointer-events:none;
  opacity:.95;
  transform:rotate(2deg);
  box-shadow:0 12px 32px rgba(0,0,0,.55)
}
.lane.over {
  outline:2px dashed var(--g);
  outline-offset:-2px
}
.kdrop {
  height:4px;
  border-radius:4px;
  background:var(--g);
  margin:0 0 8px
}
.p1 { border-color:#4caf50 }
.p2 { border-color:#ffd93b }
.p3 { border-color:#e53935 }
.msg { color:#ff6b6b; font-size:.85rem; min-height:18px }

/* Toast Notifications Container & Component */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
}
.toast {
  background: var(--bg2);
  color: var(--fg);
  border: 1px solid var(--g);
  padding: 14px 22px;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.8);
  font-size: 0.92rem;
  font-weight: 600;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 420px;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.toast.warning {
  border-color: #ffd93b;
  background: #2b281d;
  color: #ffe885;
}
.toast.error {
  border-color: #e53935;
  background: #2d1d1f;
  color: #ff9e9e;
}

.filtros {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:0 12px;
  align-items:end
}
.filtros .btn { margin-bottom:10px }
.indic {
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap
}
.indic h3 { color:var(--g); margin-bottom:4px }
.donut { position:relative; width:140px; height:140px; flex:none }
.donut svg { width:100%; height:100%; transform:rotate(-90deg) }
.donut .ct {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.15
}
.donut .ct b { font-size:1.5rem }
.donut .ct small { color:var(--mut); font-size:.72rem }
.leg { display:flex; flex-direction:column; gap:8px }
.leg span { display:flex; align-items:center; gap:8px }
.leg i { width:12px; height:12px; border-radius:50%; display:inline-block }
.feats {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin:12px 0
}
.feats .box { margin:0 }
.feats h3 { color:var(--g); font-size:1rem; margin-bottom:6px }
.steps { display:flex; flex-direction:column; gap:10px; margin:12px 0 }
.steps .st { display:flex; gap:12px; align-items:flex-start }
.steps .st p { margin:0 }
.doc ul { margin:8px 0 8px 22px }
.car img.logo { object-fit:contain; background:var(--bg2) }
.pbar { height:10px; border-radius:10px; background:var(--bd); overflow:hidden; margin:8px 0 }
.pbar div { height:100%; background:var(--g); border-radius:10px; transition:.3s }
.kcm { max-height:260px; overflow:auto; margin-top:8px }
.kcbox { margin-top:18px; border-top:1px solid var(--bd); padding-top:14px }
.kc input { user-select:text; -webkit-user-select:text }

/* --- novos recursos --- */
.box.idea.late,.idea.late { border-left-color:#e53935 }
.box.late { border-color:#e53935 }
.badge.late { background:#e53935; color:#fff }
.kc.late { box-shadow:0 0 0 2px #e53935 }
.kc.arq { opacity:.6 }
.men { color:var(--g); font-weight:700 }
.mnt { display:none; background:var(--bg3); border:1px solid var(--g); border-radius:10px; margin-top:4px; overflow:hidden }
.mnt.on { display:block }
.mnt div { padding:7px 12px; cursor:pointer; font-size:.9rem }
.mnt div:hover { background:var(--g); color:#111 }
.dup { background:var(--bg3); border:1px dashed #ffd93b; border-radius:10px; padding:8px 12px; margin:-4px 0 10px; font-size:.85rem }
.tl summary { cursor:pointer; color:var(--g); font-size:.88rem; margin:6px 0 }
.tlb { border-left:2px solid #3a3f46; margin:8px 0 4px 5px; padding-left:16px }
.tle { position:relative; padding:0 0 10px; font-size:.88rem }
.tle i { position:absolute; left:-22px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--g) }
.car .sl { position:absolute; inset:0; opacity:0; transition:.8s; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px 64px; background:linear-gradient(135deg,#1f3a1a,#26292e) }
.car .sl.on { opacity:1 }
.car .sl h2 { color:var(--g); margin:8px 0 }
.car .sl small { color:#ffd93b; font-weight:700; letter-spacing:.04em }
.car .sl.ideia > div { width:100%; max-width:760px; min-width:0; }
.car .sl.ideia p { margin:8px auto 0; max-width:700px; overflow-wrap:anywhere; }
.idea-month-meta { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:6px 16px; margin:12px auto 0; max-width:100%; font-size:.9rem; line-height:1.5; color:#f1f1f1; }
.idea-month-meta span { min-width:0; overflow-wrap:anywhere; }
.idea-month-meta .idea-month-separator { opacity:.85; font-weight:700; }
@media (max-width:600px) { .car .sl { padding:18px 42px 34px; } .idea-month-meta { gap:4px 10px; font-size:.82rem; } .car .sl.ideia h2 { font-size:1.2rem; } .car .sl.ideia p { font-size:.9rem; } }
.brow { display:flex; align-items:center; gap:10px; margin:5px 0; font-size:.88rem }
.brow .bl { width:120px; flex:none; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.brow .bt { flex:1; height:12px; background:var(--bd); border-radius:8px; overflow:hidden }
.brow .bt div { height:100%; background:var(--g) }
.kpi { font-size:1.8rem; font-weight:800; color:var(--g) }

@media (max-width:820px) {
  .box{min-width:0}
  .meta{overflow-wrap:anywhere;word-break:break-word}
  input[type=date]{font-size:14px;padding:8px 5px}
  .ideas-tabs .btn{flex:1 1 auto}
  .wrap { grid-template-columns:1fr }
  .car { height:170px }
  header img { height:34px }
  #toast-container { left: 16px; right: 16px; bottom: 85px; }
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0, 0, 0, 0.3);
  border-radius: 50%;
  border-top-color: #111;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

#optbtn{min-width:42px;position:relative}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#e53935;border:2px solid #fff;box-sizing:border-box}
.cta.plain,.login .cta{background:none!important;border:0!important;box-shadow:none!important;color:inherit;text-decoration:underline;padding:4px;display:inline-block;cursor:pointer}
.bdel{width:100%;margin-top:10px;box-sizing:border-box}
.foot{margin:40px auto 0;padding:24px 12px;text-align:center;font-size:13px;opacity:.9}
.foot .dev{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.foot .dev img{height:22px;width:22px;border-radius:6px;object-fit:cover}
.foot .brand{font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--g),#7bd88f);-webkit-background-clip:text;background-clip:text;color:transparent}
.foot small{font-size:10px;opacity:.7}
.foot .links a{margin:0 8px;cursor:pointer;text-decoration:underline}

[data-theme=light]{--bg:#f3f8f5;--bg2:#fff;--bg3:#eaf2ee;--fg:#14211b;--mut:#55665d;--g:#0b8a5f;--gd:#07694a}
[data-theme=light] .btn{color:#fff}
[data-theme=light] .btn:hover{box-shadow:0 4px 12px #0b8a5f44}
[data-theme=light] .btn.o{background:none;color:var(--g)}
[data-theme=light] .btn.r{background:#e4ece8;color:#14211b;border:1px solid #c9d6cf}
[data-theme=light] .btn.r:hover{background:#d6e2dc;box-shadow:none}
[data-theme=light] input,[data-theme=light] select,[data-theme=light] textarea{color:var(--fg);border-color:#c9d6cf}
[data-theme=light] header{background:#ffffffee}
[data-theme=light] .drop{box-shadow:0 10px 30px #0b8a5f25}
[data-theme=light] .drop a{color:var(--fg)}
[data-theme=light] .drop a:hover{background:var(--g);color:#fff}
[data-theme=light] .box{border-color:#d9e4de;box-shadow:0 1px 5px #0b8a5f14}
[data-theme=light] .badge{color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #8884;text-align:left;vertical-align:top}.tbl th{color:var(--g)}
.scr{overflow-x:auto}
.ico{width:18px;height:18px;vertical-align:-3px;margin-right:4px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act button.on .ico{fill:currentColor}
.ai{display:inline-block;width:20px;height:20px;vertical-align:-4px;margin-right:6px;animation:aispin 1.6s ease-in-out infinite;color:#ffd93b}
@keyframes aispin{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.25)}}
.acc{background:var(--bg3);border-radius:10px;margin:8px 0;padding:8px 12px}.acc summary{cursor:pointer;font-weight:700;color:var(--g)}
.q{margin:14px 0}.q label{display:flex;gap:6px;align-items:center;padding:3px 0;cursor:pointer}.q input{width:auto;margin:0}
.crs{cursor:pointer}.okb{color:var(--g);font-weight:700}

[data-theme=light]{--hd:#ffffffee;--bd:#d6e3dc;--bd2:#bccdc4;--fab:#fffffff5}
[data-theme=light] header{background:var(--hd)!important}
[data-theme=light] .act button{background:#fff}

const fluxoDe = i => { const p = DB.programas.find(x => x.programaideia == i.programaideia && x.empresa == i.empresa); return FLUXOS[p && p.fluxo] ? p.fluxo : 'simples'; };
const fluxoDesc = f => FLUXOS[f].filter(x => !['aguardando resposta do idealizador', 'reprovada'].includes(x)).map(x => x[0].toUpperCase() + x.slice(1)).join(' > ');
function nextStatus(de, fluxo) {

}
const SEM_REPROVAR = ['reprovada', 'implantada', 'rascunho', 'aguardando resposta do idealizador'];
const SEM_AGUARDAR = ['reprovada', 'implantada', 'rascunho'];

];

];

/* =========================== 2. UTILITÁRIOS ============================= */
const $ = s => document.querySelector(s);
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => {
  try { return decodeURIComponent(escape(atob(String(s).trim().replace(/\s/g, '')))).trim(); }
  catch (e) { return String(s ?? '').trim(); }
};
function parseLooseJson(text) {
  const t = String(text ?? '').trim();
  if (!t) return [];
  try { return JSON.parse(t); } catch (e) { }
  const fixed = t
    .replace(/([^,{\[\s])(\s*\n\s*)(?=")/g, '$1,$2')
    .replace(/\}(\s*\n\s*)(?=\{)/g, '},$1')
    .replace(/,(\s*[}\]])/g, '$1');
  return JSON.parse(fixed);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const semAcento = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const toList = v => (Array.isArray(v) ? v : typeof v == 'string' ? v.split(',') : []).map(x => String(x ?? '').trim()).filter(Boolean);
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtIso = s => { const p = String(s || '').split('-'); return p.length == 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };
const diasDesde = s => (Date.now() - parseDate(s)) / 86400000;

function showToast(msg, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type === 'warning' ? '⚠️' : type === 'error' ? '❌' : 'ℹ️';
  t.innerHTML = `<span>${icon} ${esc(msg)}</span>`;
  container.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 4000);
}

function now() {

  return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function parseDate(s) {
  const [a, b] = String(s || '').trim().split(/[ T]/);
  const p = (a || '').split(/[-\/]/);
  const [d, m, y] = p[0].length == 4 ? [p[2], p[1], p[0]] : p;
  return new Date(`${y}-${pad(m)}-${pad(d)}T${b || '00:00'}`);
}

/* ============================ 3. DADOS (FIREBASE) ======================= */
let DB = {};
const dirty = new Set();
let flushTimer;

const tableRef = tb => fb.db.ref('empresas/' + EMP_ID + '/' + tb);
/* o Realtime Database não aceita "undefined": remove antes de gravar */
const limpo = v => JSON.parse(JSON.stringify(v === undefined ? null : v));

function seedData() {
  return {
    perfis: [{ tipo: 'usuario_comum' }, { tipo: 'admin' }, { tipo: 'aprovador' }],
    empresas: [],
    usuarios: [], ideias: [], programas: [], comentarios: [], curtidas: [], cards: [], notificacoes: [], metas: [], comentarioscard: [], grupos: [], reclamacoes: []
  };
}

function toArray(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data == 'object') {
    const lista = Object.values(data).find(v => Array.isArray(v));
    if (lista) return lista;
    const vals = Object.values(data);
    if (vals.length && vals.every(v => v && typeof v == 'object')) return vals;
  }
  return null;
}

const LOAD_ERR = {};

async function loadTable(tb) {
  delete LOAD_ERR[tb];
  if (!EMP_ID) return null;
  try {
    const snap = await tableRef(tb).get();
    if (!snap.exists()) return [];
    const lista = toArray(snap.val());
    if (!lista) { LOAD_ERR[tb] = 'o conteúdo não é uma lista'; return null; }
    return lista.filter(x => x !== null && x !== undefined);
  } catch (e) {
    LOAD_ERR[tb] = e && /permission/i.test(e.message || e.code || '') ? 'sem permissão de acesso' : 'sem conexão com o servidor';
    return null;
  }
}

let dbOnline = true;

const firstOf = (o, ...ks) => { for (const k of ks) if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; return ''; };
const toBool = v => v === true || ['true', 'sim', 'yes', '1'].includes(String(v).trim().toLowerCase());
function normalizeIdea(i, k) {
  i = i && typeof i == 'object' ? i : {};
  const emailusuario = String(firstOf(i, 'emailusuario', 'email', 'emailautor')).trim();
  return {
    ...i,
    id: Number(firstOf(i, 'id', 'idideia')) || 100000 + k,
    titulo: firstOf(i, 'titulo', 'tituloideia', 'nomeideia', 'nome'),
    descricao: firstOf(i, 'descricao', 'descricaoideia'),
    emailusuario,
    emailaprovador: String(firstOf(i, 'emailaprovador', 'aprovador')).trim(),
    empresa: firstOf(i, 'empresa') || ((DB.usuarios || []).find(u => u.email == emailusuario) || {}).empresa || '',
    programaideia: firstOf(i, 'programaideia', 'campanha', 'programa'),
    beneficio: firstOf(i, 'beneficio'),
    data: firstOf(i, 'data', 'datacriacao', 'datacadastro'),
    dataconclusao: firstOf(i, 'dataconclusao'),
    parecer: firstOf(i, 'parecer'),
    privada: toBool(i.privada),
    status: String(firstOf(i, 'status') || 'pendente').trim(),
    tags: toList(i.tags),
    coautores: toList(i.coautores),
    anexos: (Array.isArray(i.anexos) ? i.anexos : []).filter(a => a && typeof a.dados == 'string'),
    historico: (Array.isArray(i.historico) ? i.historico : []).filter(h => h && typeof h == 'object')
  };
}

function normalizeBoard(b) {
  if (!b || typeof b != 'object' || (!('aplicacaocard' in b) && !('board' in b))) return b;
  return {
    ...b,
    board: String(b.board || ''),
    datacriacao: b.datacriacao || '',
    emailautorcriacao: String(b.emailautorcriacao || '').trim(),
    modoColunas: b.modoColunas === 'personalizado' ? 'personalizado' : 'padrao',
    colunas: Array.isArray(b.colunas) ? b.colunas.map(x => String(x || '').trim()).filter(Boolean) : [],
    usuarios: (Array.isArray(b.usuarios) ? b.usuarios : [])
      .map(u => ({ email: String((u && u.email) || (typeof u == 'string' ? u : '')).trim() })).filter(u => u.email),
    aplicacaocard: (Array.isArray(b.aplicacaocard) ? b.aplicacaocard : []).map(normalizeCard)
  };
}

function mergeBoard(local, remote, snapJson) {
  if (!Array.isArray(local.aplicacaocard) || !Array.isArray(remote.aplicacaocard))
    return JSON.stringify(local) === snapJson ? remote : local;
  const snap = snapJson ? JSON.parse(snapJson) : { aplicacaocard: [] };
  const sc = new Map((snap.aplicacaocard || []).map(c => [String(c.id), JSON.stringify(c)]));
  const rc = new Map(remote.aplicacaocard.map(c => [String(c.id), c]));
  const lc = new Set(local.aplicacaocard.map(c => String(c.id)));
  const cards = [];
  local.aplicacaocard.forEach(c => {
    const id = String(c.id);
    if (!sc.has(id) || JSON.stringify(c) !== sc.get(id)) cards.push(c);
    else if (rc.has(id)) cards.push(rc.get(id));
  });
  remote.aplicacaocard.forEach(r => { const id = String(r.id); if (!lc.has(id) && !sc.has(id)) cards.push(r); });
  const semCards = o => JSON.stringify({ ...o, aplicacaocard: 0 });
  const base = semCards(local) === semCards(snap) ? remote : local;
  return { ...base, aplicacaocard: cards };
}

/* reclamação: as mensagens de quem usuário e superadmin são somadas; os demais campos seguem quem alterou por último */
function mergeRecl(local, remote, snapJson) {
  const snap = snapJson ? JSON.parse(snapJson) : {};
  const mk = m => [m.papel, m.autor, m.data, m.texto].join('|');
  const seen = new Set(), msgs = [];
  [...(Array.isArray(remote.mensagens) ? remote.mensagens : []), ...(Array.isArray(local.mensagens) ? local.mensagens : [])]
    .forEach(m => { if (!m || !m.texto) return; const k = mk(m); if (!seen.has(k)) { seen.add(k); msgs.push(m); } });
  msgs.sort((a, b) => (parseDate(a.data) - parseDate(b.data)) || 0);
  const semM = o => JSON.stringify({ ...o, mensagens: 0 });
  const base = semM(local) === semM(snap) ? remote : local;
  return { ...base, mensagens: msgs };
}

function normalizeCard(c, k) {
  c = c && typeof c == 'object' ? c : {};
  return { ...c, id: Number(c.id) || 200000 + k, prioridade: Number(c.prioridade) || 1,
           status: String(c.status || LANES[0]),
           subcards: (Array.isArray(c.subcards) ? c.subcards : []).map((x, i) => ({ id: Number(x && x.id) || (Number(c.id || 200000 + k) * 1000 + i + 1), descricao: String((x && x.descricao) || ''), status: x && (x.status === 'concluido' || x.concluida) ? 'concluido' : 'pendente' })) };
}

function metaPct(subs) {
  return subs.length ? Math.round(subs.filter(x => x.concluida).length * 100 / subs.length) : 0;
}
function normalizeMeta(m) {
  m = m && typeof m == 'object' ? m : {};
  const submeta = (Array.isArray(m.submeta) ? m.submeta : []).map(x => ({
    ...(x && typeof x == 'object' ? x : {}),
    descricao: String((x && x.descricao) || ''),
    concluida: toBool(x && x.concluida),
    responsavel: String((x && x.responsavel) || '').trim(),
    concluidaPor: String((x && x.concluidaPor) || '').trim()
  }));
  const usuarios = (Array.isArray(m.usuarios) ? m.usuarios : [])
    .map(u => ({ email: String((u && u.email) || (typeof u == 'string' ? u : '')).trim() }))
    .filter(u => u.email);
  return { ...m, meta: String(m.meta || ''), autor: String(m.autor || '').trim(),
           campanha: String(m.campanha || ''), alvo: Number(m.alvo) || 0, avisoVencida: m.avisoVencida || '',
           dataCriacao: m.dataCriacao || '', dataPrevisaoConclusao: m.dataPrevisaoConclusao || '',
           submeta, usuarios, porcentagemConclusao: metaPct(submeta) };
}

const SYNC = {
  metas:       { key: m => [m.meta, m.dataCriacao, m.autor].join('|'), norm: l => l.map(normalizeMeta) },
  comentarioscard: { key: c => [c.idcardaplicacao, c.autorcomentario, c.data, c.comentario].join('|'), norm: l => l },
  ideias:      { key: i => String(i.id), norm: l => l.map(normalizeIdea) },
  curtidas:    { key: c => c.idideia + '|' + c.autorcurtida, norm: l => l },
  comentarios: { key: c => [c.idideia, c.autorcomentario, c.data, c.comentario].join('|'), norm: l => l },
  reclamacoes: { key: r => String(r.id), norm: l => l, merge: mergeRecl },
  cards:       { key: b => [b.board, b.datacriacao, b.emailautorcriacao].join('|'), norm: l => l.map(normalizeBoard), merge: mergeBoard }
};
const SNAP = {};
const snapshot = t => { SNAP[t] = new Map(DB[t].map(x => [SYNC[t].key(x), JSON.stringify(x)])); };

function normalizeData() {
  DB.usuarios = DB.usuarios.map(u => ({
    ...u,
    nome: u.nome || u.nomeusuario || '',
    email: (u.email || u.emailusuario || '').trim(),
    senha: u.senha || u.senhausuario || '',
    ativo: u.ativo !== false
  }));
  DB.ideias = SYNC.ideias.norm(DB.ideias);
  DB.cards = SYNC.cards.norm(DB.cards);
  DB.metas = SYNC.metas.norm(DB.metas);
}

async function loadAll() {
  const seed = seedData();
  const loaded = await Promise.all(TABLES.map(loadTable));
  dbOnline = loaded.some(x => x !== null);
  TABLES.forEach((tb, k) => { DB[tb] = loaded[k] !== null ? loaded[k] : seed[tb]; });
  DB.perfis = seed.perfis;
  DB.empresas = EMPRESA ? [EMPRESA] : seed.empresas;
  normalizeData();
  Object.keys(SYNC).forEach(snapshot);
}

async function loadCompanyData() {
  const falha = 'Não foi possível carregar os dados da empresa. Tente novamente.';
  try {
    if (!EMP_ID) return 'Empresa do usuário não encontrada. Fale com o administrador.';
    const info = (await fb.db.ref('empresas/' + EMP_ID + '/info').get()).val();
    if (!info) return 'Empresa do usuário não encontrada. Fale com o administrador.';
    EMPRESA = info;
    await loadAll();
    if (!dbOnline) return falha;
    ME = syncUser(ME);
    return '';
  } catch (e) { return falha; }
}

async function refreshData() {
  let changed = false;
  for (const t of Object.keys(SYNC)) {
    if (dirty.has(t) || flushing.has(t)) continue;
    const lista = await loadTable(t);
    if (!lista) continue;
    /* Durante o await acima o usuário pode ter criado/editado algo (ex.: novo card). Se a tabela ficou "suja"
       ou está sendo gravada, descarta esta leitura (é anterior à alteração) para não apagar o que acabou de ser salvo. */
    if (dirty.has(t) || flushing.has(t)) continue;
    const nova = SYNC[t].norm(lista);
    if (JSON.stringify(nova) !== JSON.stringify(DB[t])) { DB[t] = nova; changed = true; }
    snapshot(t);
  }
  return changed;
}

async function mergeRemote(t) {
  const sy = SYNC[t];
  const remoto = await loadTable(t);
  if (!remoto) return;
  const snap = SNAP[t] || new Map();
  const pos = new Map(DB[t].map((x, k) => [sy.key(x), k]));
  sy.norm(remoto).forEach(r => {
    const k = sy.key(r), at = pos.get(k);
    if (at === undefined) { if (!snap.has(k)) DB[t].push(r); }
    else if (sy.merge) DB[t][at] = sy.merge(DB[t][at], r, snap.get(k));
    else if (JSON.stringify(DB[t][at]) === snap.get(k)) DB[t][at] = r;
  });
}

function save(...tables) {
  tables.forEach(t => dirty.add(t));
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

const flushing = new Set();
async function writeTable(tb) {
  flushing.add(tb);
  try {
    if (SYNC[tb]) await mergeRemote(tb);
    await tableRef(tb).set(limpo(DB[tb]));
    if (SYNC[tb]) snapshot(tb);
  } finally { flushing.delete(tb); }
}

async function flush() {
  for (const tb of [...dirty]) {
    dirty.delete(tb); /* se o usuário alterar de novo durante a gravação, save() marca como suja outra vez */
    try { await writeTable(tb); }
    catch (e) {
      dirty.add(tb);
      console.warn('Falha ao gravar "' + tb + '":', e);
      showToast('Não foi possível salvar as alterações. Verifique a conexão.', 'error');
    }
  }
}

const getUser = email => DB.usuarios.find(u => u.email == email) || { nome: email };
function avatarHtml(nome, size = 30) {
  const parts = String(nome || '').trim().split(/\s+/).filter(Boolean);
  const initials = (parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : (parts[0] || '?').slice(0, 2)).toUpperCase();
  return `<span class="av avatar-sm" style="width:${size}px;height:${size}px;font-size:${Math.max(10, Math.round(size * .36))}px" title="${esc(nome || '')}">${esc(initials)}</span>`;
}

function erroAuth(e) {
  const c = (e && e.code) || '';
  if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password', 'auth/invalid-email'].includes(c)) return 'E-mail ou senha incorretos.';
  if (c == 'auth/user-disabled') return 'Usuário inativo. Fale com o administrador.';
  if (c == 'auth/too-many-requests') return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if (c == 'auth/network-request-failed') return 'Sem conexão. Verifique sua internet.';
  return 'Erro ao realizar o login. Tente novamente.';
}

    const cred = await fb.auth.signInWithEmailAndPassword(email, senha);
    return await montarSessao(cred.user);
  } catch (e) { limparSegredos(); return { erro: erroAuth(e) }; }

/* Solicita ao gerenciador de senhas do navegador que salve a credencial após login bem-sucedido.
   A senha nunca é gravada no localStorage/sessionStorage pelo INSIGHT. */
async function salvarCredencialNoNavegador(email, senha) {
  // A API de credenciais só existe em alguns navegadores/contextos seguros.
  // Tentamos primeiro criar a credencial explicitamente; alguns browsers suportam a forma via formulário.
  if (!window.isSecureContext || !navigator.credentials || typeof navigator.credentials.store !== 'function') return false;
  try {
    if (typeof window.PasswordCredential === 'function') {
      const credencial = new PasswordCredential({ id: email, password: senha, name: email });
      await navigator.credentials.store(credencial);
      return true;
    }
  } catch (e) { console.debug('Armazenamento de credencial explícita indisponível:', e); }
  try {
    const form = document.getElementById('loginForm');
    if (form && typeof window.PasswordCredential === 'function') {
      await navigator.credentials.store(new PasswordCredential(form));
      return true;
    }
  } catch (e) { console.debug('Armazenamento por formulário indisponível:', e); }
  return false;
}

function gestoresDe(u, usuarios) {
  const outros = usuarios.filter(x => x.ativo && x.email.toLowerCase() != u.email.toLowerCase());
  const direto = String(u.emailgestor || '').trim().toLowerCase();
  const d = outros.filter(x => x.email.toLowerCase() == direto);
  if (d.length) return d.map(x => x.email);
  const mesma = outros.filter(x => x.empresa == u.empresa);
  const admins = mesma.filter(x => x.perfil == 'admin');
  return (admins.length ? admins : mesma.filter(x => x.perfil == 'aprovador')).map(x => x.email);
}

/* ============ LOGOUT AUTOMÁTICO: a sessão dura no máximo 60 minutos desde o login ============ */
const SESSAO_MAX_MIN = 60, SESSAO_AVISO_MIN = 5, SESSAO_KEY = 'ins_login_ts';
const SESSAO_MSG = 'Sua sessão expirou após 60 minutos. Entre novamente.';
let sessaoTimer, sessaoAvisou = false;
function loginTsSet() { lsSet(SESSAO_KEY, String(Date.now())); sessaoAvisou = false; }
function loginTsClear() { try { localStorage.removeItem(SESSAO_KEY); } catch (e) { } sessaoAvisou = false; }
const loginTsGet = () => Number(lsGet(SESSAO_KEY)) || 0;
const sessaoExpirada = () => { const ts = loginTsGet(); return !!ts && Date.now() - ts >= SESSAO_MAX_MIN * 60000; };
function iniciarSessaoTimer() {
  if (!loginTsGet()) loginTsSet();
  clearInterval(sessaoTimer);
  sessaoTimer = setInterval(checarSessao, 15000);
}
async function checarSessao() {
  if (!fb.auth.currentUser) { clearInterval(sessaoTimer); return; }
  const ts = loginTsGet();
  if (!ts) return;
  const resta = SESSAO_MAX_MIN * 60000 - (Date.now() - ts);
  if (resta > 0) {
    if (resta <= SESSAO_AVISO_MIN * 60000 && !sessaoAvisou) { sessaoAvisou = true; showToast('Sua sessão expira em poucos minutos. Salve o que estiver fazendo.', 'warning'); }
    return;
  }
  clearInterval(sessaoTimer);
  const admin = !ME;
  try { if (dirty.size) await flush(); } catch (e) { }
  loginTsClear();
  if (admin) { try { fb.auth.signOut(); } catch (e) { } EMP_ID = ''; renderAdminLogin(); const m = $('#am'); if (m) m.textContent = SESSAO_MSG; }
  else { logout(); const m = $('#lm'); if (m) m.textContent = SESSAO_MSG; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarSessao(); });

/* menções com @ */
const MN_LIST = {};
function mentionTokens() {
  const us = companyUsers().filter(u => u.ativo);
  const primeiros = {};
  us.forEach(u => { const f = String(u.nome || '').trim().split(/\s+/)[0].toLowerCase(); if (f) primeiros[f] = (primeiros[f] || 0) + 1; });
  const out = [];
  us.forEach(u => {
    const nome = String(u.nome || '').trim();
    if (nome) out.push({ tok: nome, email: u.email });
    const f = nome.split(/\s+/)[0];
    if (f && f != nome && primeiros[f.toLowerCase()] == 1) out.push({ tok: f, email: u.email });
  });
  return out.sort((a, b) => b.tok.length - a.tok.length);
}
function mentionedEmails(texto) {
  const out = new Set();
  mentionTokens().forEach(({ tok, email }) => {
    if (sameEmail(email, ME.email) || out.has(email)) return;
    if (new RegExp('@' + escRe(tok) + '(?![\\p{L}\\p{N}_])', 'iu').test(String(texto))) out.add(email);
  });
  return [...out];
}
function fmtComent(texto) {
  const h = esc(texto), t = mentionTokens();
  if (!t.length) return h;
  const re = new RegExp('@(' + t.map(x => escRe(esc(x.tok))).join('|') + ')(?![\\p{L}\\p{N}_])', 'giu');
  return h.replace(re, m => `<span class="men">${m}</span>`);
}
function notifMencoes(texto, onde, extra) {
  return mentionedEmails(texto).map(e => ({ tipo: 'mencao', destinoEmail: e, titulo: 'Você foi citado em um comentário',
    mensagem: `${ME.nome} citou você em um comentário ${onde}.`, ...extra }));
}
function mentionSuggest(el) {
  const box = document.getElementById('mn_' + el.id);
  if (!box) return;
  const m = /(^|\s)@([^\s@]{0,30})$/.exec(el.value.slice(0, el.selectionStart));
  if (!m) { box.classList.remove('on'); box.innerHTML = ''; return; }
  const q = semAcento(m[2]);
  const us = companyUsers().filter(u => u.ativo && !sameEmail(u.email, ME.email) && semAcento(u.nome).includes(q)).slice(0, 5);
  MN_LIST[el.id] = us.map(u => u.nome);
  box.innerHTML = us.map((u, k) => `<div onmousedown="event.preventDefault();pickMention('${el.id}',${k})">${esc(u.nome)}</div>`).join('');
  box.classList.toggle('on', us.length > 0);
}
function pickMention(id, k) {
  const el = document.getElementById(id), nome = (MN_LIST[id] || [])[k];
  if (!el || !nome) return;
  const pos = el.selectionStart;
  const antes = el.value.slice(0, pos).replace(/@[^\s@]*$/, '@' + nome + ' ');
  el.value = antes + el.value.slice(pos);
  el.focus();
  el.setSelectionRange(antes.length, antes.length);
  const box = document.getElementById('mn_' + id);
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
}

  return `
  <div class="box idea${atrasada ? ' late' : ''}">

function scoreRanking() {
  const dentro = i => RANK.modo == 'mes' ? mesDe(i) == RANK.mes

  return companyUsers().map(u => {

  imgs.forEach((x, k) => x.classList.toggle('on', k == carousel.index));
  document.querySelectorAll('.dots i').forEach((x, k) => x.classList.toggle('on', k == carousel.index));
  $('#qt').textContent = slideText(carousel.index);

function filtraTodas(ignoraStatus) {
  const f = FILTRO_TODAS;
  const de = f.de ? new Date(f.de + 'T00:00:00') : null;
  const ate = f.ate ? new Date(f.ate + 'T23:59:59') : null;
  return ideiasBaseTodas().filter(i => {

      if (isNaN(d) || (de && d < de) || (ate && d > ate)) return false;

    if (!ignoraStatus && f.status && i.status != f.status) return false;
    return true;
  });
}

function indicadorHtml(base = filtraTodas(true)) {
  const impl = base.filter(i => i.status == 'implantada').length;
  const repr = base.filter(i => i.status == 'reprovada').length;
  const total = impl + repr;
  const R = 54, C = 2 * Math.PI * R;
  const aImpl = total ? C * impl / total : 0;
  const aRepr = total ? C * repr / total : 0;
  const pct = total ? Math.round(impl * 100 / total) : 0;
  return `
    <div class="indic">
      <div class="donut">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="#3a3f46" stroke-width="18"></circle>
          ${total ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="#2f80ff" stroke-width="18" stroke-dasharray="${aImpl} ${C - aImpl}"></circle>
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="#e53935" stroke-width="18" stroke-dasharray="${aRepr} ${C - aRepr}" stroke-dashoffset="${-aImpl}"></circle>` : ''}
        </svg>
        <div class="ct"><b>${total ? pct + '%' : '-'}</b><small>implantadas</small></div>
      </div>
      <div>
        <h3>Indicador: implantadas x reprovadas</h3>

      </div>
    </div>`;
}

/* sugestão de ideias parecidas */
function ideiasSimilares(titulo, idAtual) {
  const stop = new Set(['para', 'com', 'uma', 'das', 'dos', 'que', 'por', 'mais', 'como', 'sem', 'nas', 'nos', 'pelo', 'pela', 'ser', 'sua', 'seu']);
  const toks = t => new Set(semAcento(t).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !stop.has(w)).map(w => w.slice(0, 5)));
  const a = toks(titulo), tNorm = semAcento(titulo).trim();
  if (!a.size || tNorm.length < 3) return [];
  return companyIdeas()
    .filter(i => i.id != idAtual && (!i.privada || sameEmail(i.emailusuario, ME.email)) && (i.status != 'rascunho' || sameEmail(i.emailusuario, ME.email)))
    .map(i => {
      const b = toks(i.titulo);
      const inter = [...a].filter(w => b.has(w)).length, uni = new Set([...a, ...b]).size;
      return { i, score: uni ? inter / uni : 0, sub: tNorm.length >= 4 && semAcento(i.titulo).includes(tNorm) };
    })
    .filter(x => x.score >= 0.34 || x.sub)
    .sort((x, y) => y.score - x.score).slice(0, 4).map(x => x.i);
}
function showSimilar(idAtual) {
  const el = $('#fdup'); if (!el) return;
  const lista = ideiasSimilares($('#f1').value, idAtual);
  el.innerHTML = lista.length ? `<div class="dup"><b><svg class="ai" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>IA analisou: ideias parecidas já cadastradas</b>
    ${lista.map(i => `<div>• ${esc(i.titulo)} <small>(${esc(i.status)} · ${esc(getUser(i.emailusuario).nome)})</small></div>`).join('')}</div>` : '';
}

async function saveIdea(id, status) {
  const titulo = $('#f1').value.trim(), descricao = $('#f2').value.trim();
  if (!titulo || !descricao || !$('#f3').value)
    return $('#fm').textContent = 'Preencha título, descrição e programa de ideia.';

  const antiga = DB.ideias.find(x => x.id == id);
  const prog = companyPrograms().find(p => p.programaideia == $('#f3').value);
  const aprovador = (prog && prog.emailaprovador) || (antiga && antiga.emailaprovador) || '';
  if (!aprovador)
    return $('#fm').textContent = 'Este programa de ideia ainda não tem aprovador. Peça a um gestor para editá-lo.';
  if (prog && campanhaEncerrada(prog) && (!antiga || antiga.programaideia != prog.programaideia))
    return $('#fm').textContent = 'Este programa de ideia já foi encerrado.';

  const isNew = !id;
  const idea = antiga ||
    { id: Date.now(), empresa: ME.empresa, emailusuario: ME.email, data: now(), dataconclusao: '', parecer: '', historico: [] };
  const statusAntigo = idea.status;
  const tags = [...new Set(($('#ftags')?.value || '').split(',').map(x => x.trim()).filter(Boolean))];
  const coautores = [...document.querySelectorAll('#fco input:checked')].map(x => x.value);

  Object.assign(idea, { titulo, descricao, programaideia: $('#f3').value, beneficio: $('#f4').value,
    emailaprovador: aprovador, privada: $('#f6').checked, status, tags, coautores, anexos: [...ANEXOS_TMP] });
  if (!Array.isArray(idea.historico)) idea.historico = [];
  if (statusAntigo !== status) addHist(idea, statusAntigo || '', status, '');

  if (isNew) DB.ideias.push(idea);

  if (status === 'pendente') {
    pushNotification({
      tipo: 'ideia_enviada',
      destinoEmail: aprovador,
      titulo: 'Nova ideia recebida para avaliação',
      mensagem: `A ideia "${titulo}" foi enviada para sua aprovação por ${ME.nome}.`,
      idideia: idea.id
    });
  }

  ANEXOS_TMP = [];
  save('ideias'); closeM(); render();
  showToast(isNew ? 'Ideia salva com sucesso!' : 'Ideia atualizada com sucesso!');
}

async function saveEval(id) {
  const i = DB.ideias.find(x => x.id == id);
  if (i && i.status === 'em implantação' && !sameEmail(i.emailimplantador, ME.email)) return showToast('Somente o implantador pode ajustar uma ideia em implantação.', 'warning');
  const statusAntigo = i.status;
  const parecerAntigo = i.parecer;

  if (!statusPermitido(statusAntigo, $('#e1').value, fluxoDe(i))) return showToast('Transição de status não permitida.', 'warning');
  i.status = $('#e1').value;
  i.parecer = $('#e2').value;
  if (i.status == 'em implantação') {
    const novo = $('#e4').value;
    if (novo && !sameEmail(novo, i.emailimplantador) && !sameEmail(novo, ME.email))
      pushNotification({ tipo: 'implantador', destinoEmail: novo, titulo: 'Você é implantador de uma ideia', mensagem: `Você foi indicado como implantador da ideia "${i.titulo}".`, idideia: i.id });
    i.emailimplantador = novo; i.parceiros = $('#e5').value.trim();
  }
  if (['implantada', 'reprovada'].includes(i.status)) i.dataconclusao = now();

  if (statusAntigo !== i.status || parecerAntigo !== i.parecer) {
    addHist(i, statusAntigo, i.status, i.parecer);
    pushNotification({
      tipo: 'ideia_atualizada',
      destinoEmail: i.emailusuario,
      titulo: 'Sua ideia teve atualizações',
      mensagem: `Sua ideia "${i.titulo}" teve o status alterado para "${i.status}" ou recebeu um novo parecer pelo aprovador.`,
      idideia: i.id
    });
  }

  save('ideias'); closeM(); render();
  showToast(i.status == 'em implantação' && statusAntigo != i.status
    ? 'Status atualizado! Use "Criar card" na ideia para levá-la a um board.' : 'Avaliação/Status atualizados!');
}

function tempoAvaliacaoDias(i) {
  if (!STATUS_FIM.includes(i.status)) return null;
  const hs = i.historico || [];
  const hIni = hs.find(x => x.para == 'pendente'), hFim = hs.find(x => STATUS_FIM.includes(x.para));
  const ini = parseDate(hIni ? hIni.data : i.data);
  const fim = hFim ? parseDate(hFim.data) : (i.dataconclusao ? parseDate(i.dataconclusao) : null);
  if (!fim || isNaN(ini) || isNaN(fim)) return null;
  return Math.max(0, (fim - ini) / 86400000);
}

const barrasHtml = rows => {
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="brow"><span class="bl" title="${esc(r.l)}">${esc(r.l)}</span><div class="bt"><div style="width:${r.v * 100 / max}%"></div></div><b>${r.v}</b></div>`).join('');
};

const FILTRO_INDICADORES = { de: '', ate: '', campanha: '', status: '' };

function filtraIndicadores() {
  const f = FILTRO_INDICADORES;
  const de = f.de ? new Date(f.de + 'T00:00:00') : null;
  const ate = f.ate ? new Date(f.ate + 'T23:59:59') : null;
  return ideiasBaseTodas().filter(i => {
    if (i.status === 'rascunho') return false;
    if (de || ate) {
      const d = parseDate(i.data);
      if (isNaN(d) || (de && d < de) || (ate && d > ate)) return false;
    }
    if (f.campanha && i.programaideia !== f.campanha) return false;
    if (f.status && i.status !== f.status) return false;
    return true;
  });
}
function setFiltroIndicadores(campo, valor) {
  FILTRO_INDICADORES[campo] = valor;
  render();
}
function limparFiltroIndicadores() {
  Object.assign(FILTRO_INDICADORES, { de: '', ate: '', campanha: '', status: '' });
  render();
}

function viewIndicadores() {
  if (!isApprover()) return '<div class="wrap one"><div class="box">Acesso restrito a aprovadores.</div></div>';
  const f = FILTRO_INDICADORES;
  const base = filtraIndicadores();
  const aprov = base.filter(i => ['em implantação', 'implantada'].includes(i.status)).length;
  const repr = base.filter(i => i.status == 'reprovada').length;
  const taxa = aprov + repr ? Math.round(aprov * 100 / (aprov + repr)) : null;
  const tempos = base.map(tempoAvaliacaoDias).filter(x => x != null);
  const medio = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null;
  const emAvaliacao = base.filter(i => STATUS_AVALIACAO.includes(i.status));
  const atrasadas = emAvaliacao.filter(ideaAtrasada).length;
  const hoje = new Date(), meses = [];
  for (let k = 11; k >= 0; k--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - k, 1);
    meses.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
  }
  const porMes = meses.map(m => ({ l: rotuloMes(m), v: base.filter(i => mesDe(i) == m).length }));
  const camp = {};
  base.forEach(i => { const c = i.programaideia || '(sem programa de ideia)'; camp[c] = (camp[c] || 0) + 1; });
  const topCamp = Object.entries(camp).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([l, v]) => ({ l, v }));
  return `
  <div class="wrap one"><div>
    <h2>Indicadores</h2><br>
    <div class="box filtros">
      <div><label>Data inicial</label><input type="date" value="${esc(f.de)}" onchange="setFiltroIndicadores('de',this.value)"></div>
      <div><label>Data final</label><input type="date" value="${esc(f.ate)}" onchange="setFiltroIndicadores('ate',this.value)"></div>
      <div><label>Campanha</label><select onchange="setFiltroIndicadores('campanha',this.value)">
        <option value="">Todas as campanhas</option>
        ${companyPrograms().map(p => `<option value="${esc(p.programaideia)}" ${p.programaideia == f.campanha ? 'selected' : ''}>${esc(p.programaideia)}</option>`).join('')}
      </select></div>
      <div><label>Status</label><select onchange="setFiltroIndicadores('status',this.value)">
        <option value="">Todos os status</option>
        ${STATUS.filter(x => x != 'rascunho').map(x => `<option value="${esc(x)}" ${x == f.status ? 'selected' : ''}>${esc(x)}</option>`).join('')}
      </select></div>
      <div><button class="btn r" style="width:100%" onclick="limparFiltroIndicadores()">Limpar filtros</button></div>
    </div>
    <div class="feats">
      <div class="box"><div class="kpi">${base.length}</div><p class="meta">ideias enviadas</p></div>
      <div class="box"><div class="kpi">${taxa == null ? '-' : taxa + '%'}</div><p class="meta">taxa de aprovação (em implantação + implantadas ÷ decididas)</p></div>
      <div class="box"><div class="kpi">${medio == null ? '-' : medio.toFixed(1).replace('.', ',') + ' d'}</div><p class="meta">tempo médio de avaliação</p></div>
      <div class="box ${atrasadas ? 'late' : ''}"><div class="kpi" style="${atrasadas ? 'color:#ff6b6b' : ''}">${atrasadas}</div><p class="meta">ideias atrasadas na avaliação (de ${emAvaliacao.length} em avaliação · prazo ${PRAZO_AVALIACAO_DIAS} dias)</p></div>
    </div>
    <div class="box"><h3 style="color:var(--g);margin-bottom:8px">Ideias por mês</h3>${barrasHtml(porMes)}</div>
    <div class="box"><h3 style="color:var(--g);margin-bottom:8px">Campanhas mais ativas</h3>${topCamp.length ? barrasHtml(topCamp) : '<p class="meta">Sem dados.</p>'}</div>
    <div class="box">${indicadorHtml(base)}</div>
  </div></div>`;
}

function exportarCsv() {
  const list = byNewest(filtraTodas(false));
  if (!list.length) return showToast('Nenhuma ideia para exportar com os filtros atuais.', 'warning');
  const cols = [
    ['ID', i => i.id], ['Título', i => i.titulo], ['Descrição', i => i.descricao],
    ['Autor', i => getUser(i.emailusuario).nome], ['E-mail do autor', i => i.emailusuario],
    ['Coautores', i => (i.coautores || []).map(e => getUser(e).nome).join(', ')],
    ['Programa de ideia', i => i.programaideia], ['Benefício', i => i.beneficio],
    ['Aprovador', i => getUser(i.emailaprovador).nome], ['Status', i => i.status],
    ['Data', i => i.data], ['Conclusão', i => i.dataconclusao], ['Parecer', i => i.parecer],
    ['Curtidas', i => ideaLikes(i).length], ['Comentários', i => ideaComments(i).length],
    ['Privada', i => i.privada ? 'Sim' : 'Não']
  ];
  const cel = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
  const csv = '\ufeff' + [cols.map(c => cel(c[0])).join(';'), ...list.map(i => cols.map(c => cel(c[1](i))).join(';'))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ideias_${todayIso()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast(`${list.length} ideia(s) exportada(s).`);
}

function formatDate(s) {
  if (!s) return '';
  if (s.includes('T') || s.includes('-')) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`;
    }
  }
  return s;
}

function saveProgram(antigo) {
  const titulo = $('#g1').value.trim();
  const descricao = $('#g2').value.trim();
  const criterio = $('#g3').value.trim();
  const inicio = $('#g4').value, fim = $('#g5').value, fluxo = $('#g6').value;
  const aprovador = $('#g7').value, implantador = $('#g8').value;
  if (!titulo) return $('#gm').textContent = 'O título é obrigatório.';
  if (!aprovador) return $('#gm').textContent = 'Selecione o aprovador do programa de ideia.';
  if (inicio && fim && fim < inicio) return $('#gm').textContent = 'O fim não pode ser anterior ao início.';

  const p = companyPrograms().find(x => x.programaideia == antigo);
  if (p) {
    if (antigo !== titulo) {
      companyIdeas().filter(i => i.programaideia == antigo).forEach(i => i.programaideia = titulo);
      save('ideias');
    }
    const apAnt = p.emailaprovador || '';
    Object.assign(p, { programaideia: titulo, descricao, criterio, inicio, fim, fluxo, emailaprovador: aprovador, emailimplantador: implantador });
    save('programas');
    /* trocou o aprovador do programa: as ideias ainda em avaliação passam para o novo aprovador */
    if (!sameEmail(aprovador, apAnt)) {
      const abertas = companyIdeas().filter(i => i.programaideia == titulo && STATUS_EDITAVEIS.includes(i.status) && !sameEmail(i.emailaprovador, aprovador));
      abertas.forEach(i => i.emailaprovador = aprovador);
      if (abertas.length) {
        save('ideias');
        pushNotifications(abertas.filter(() => !sameEmail(aprovador, ME.email)).map(i => ({ tipo: 'novo_aprovador', destinoEmail: aprovador,
          titulo: 'Você é o novo aprovador de uma ideia', mensagem: `Você passou a ser o aprovador do programa de ideia "${titulo}" e da ideia "${i.titulo}".`, idideia: i.id })));
      }
    }
  } else {
    DB.programas.push({
      programaideia: titulo,
      empresa: ME.empresa,
      descricao,
      criterio,
      inicio,
      fim,
      fluxo,
      emailaprovador: aprovador,
      emailimplantador: implantador,
      emailautor: ME.email
    });
    save('programas');
  }
  closeM();
  render();
}

function deleteProgram(nome) {
  const temIdeias = companyIdeas().some(i => i.programaideia == nome);
  if (temIdeias) {
    showToast('Há ideias vinculadas a este programa de ideia. Não é possível excluir.');
    return;
  }

  showConfirm(`Deseja realmente excluir o programa de ideia "${nome}"?`, () => {
    const idx = DB.programas.findIndex(p => p.programaideia == nome && p.empresa == ME.empresa);
    if (idx >= 0) {
      DB.programas.splice(idx, 1);
      save('programas');
      render();
    }
  });
}

const laneCards = (cards, lane) => cards.filter(c => c.status == lane)
  .sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || b.prioridade - a.prioridade);
let kdrag = null;

function kStart(e, id) {
  if (e.pointerType == 'mouse' && e.button !== 0) return;
  if (e.target.closest('button,input,select,textarea,a')) return;
  if (e.pointerType != 'mouse' && !e.target.closest('.kh')) return;
  kCleanup();
  kdrag = { id, el: e.currentTarget, x0: e.clientX, y0: e.clientY, started: false, lane: null, before: null };
  document.addEventListener('pointermove', kMove);
  document.addEventListener('pointerup', kEnd);
  document.addEventListener('pointercancel', kCleanup);
  document.addEventListener('keydown', kKey);
}

function kMove(e) {
  const d = kdrag;
  if (!d) return;
  if (!d.started) {
    if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
    const r = d.el.getBoundingClientRect();
    d.started = true; d.dx = d.x0 - r.left; d.dy = d.y0 - r.top;
    d.ghost = d.el.cloneNode(true);
    d.ghost.classList.add('kfloat');
    d.ghost.style.width = r.width + 'px';
    document.body.appendChild(d.ghost);
    d.el.classList.add('dragging');
    document.body.style.userSelect = 'none';
  }
  d.ghost.style.left = (e.clientX - d.dx) + 'px';
  d.ghost.style.top = (e.clientY - d.dy) + 'px';

  document.querySelectorAll('.lane.over').forEach(l => l.classList.remove('over'));
  document.querySelectorAll('.kdrop').forEach(x => x.remove());
  d.lane = d.before = null;
  const lane = (document.elementFromPoint(e.clientX, e.clientY) || document.body).closest('.lane');
  if (lane) {
    lane.classList.add('over');
    d.lane = lane.dataset.lane;
    const alvo = [...lane.querySelectorAll('.kc:not(.dragging)')].find(c => {
      const r = c.getBoundingClientRect();
      return e.clientY < r.top + r.height / 2;
    });
    d.before = alvo ? +alvo.dataset.id : null;
    const marca = document.createElement('div');
    marca.className = 'kdrop';
    if (alvo) lane.insertBefore(marca, alvo); else lane.appendChild(marca);
  }
  const board = document.querySelector('.board');
  if (board) {
    const b = board.getBoundingClientRect();
    if (e.clientX < b.left + 40) board.scrollLeft -= 16; else if (e.clientX > b.right - 40) board.scrollLeft += 16;
  }
  if (e.clientY < 70) scrollBy(0, -16); else if (e.clientY > innerHeight - 70) scrollBy(0, 16);
}

function kEnd() {
  const d = kdrag;
  kCleanup();
  if (d && d.started && d.lane) moveCard(d.id, d.lane, d.before);
}
const kKey = e => { if (e.key == 'Escape') kCleanup(); };

function kCleanup() {
  ['pointermove', 'pointerup', 'pointercancel', 'keydown'].forEach((t, k) =>
    document.removeEventListener(t, [kMove, kEnd, kCleanup, kKey][k]));
  if (kdrag) { if (kdrag.ghost) kdrag.ghost.remove(); kdrag.el.classList.remove('dragging'); }
  document.querySelectorAll('.lane.over').forEach(l => l.classList.remove('over'));
  document.querySelectorAll('.kdrop').forEach(x => x.remove());
  document.body.style.userSelect = '';
  kdrag = null;
}

function moveCard(id, lane, beforeId) {
  const b = currentBoard();
  const c = b && b.aplicacaocard.find(x => x.id == id);
  if (!c || !boardLanes(b).includes(lane)) return;
  const dest = laneCards(b.aplicacaocard, lane).filter(x => x.id != id);
  const at = beforeId == null ? -1 : dest.findIndex(x => x.id == beforeId);
  dest.splice(at < 0 ? dest.length : at, 0, c);
  if (c.status != lane && b.modoColunas !== 'personalizado') c.dataconclusao = lane == 'FINALIZADO' ? now() : '';
  c.status = lane;
  if (lane != 'FINALIZADO') delete c.arquivado;
  dest.forEach((x, k) => { x.ordem = k + 1; });
  save('cards');
  render();
}

function renderSubcards(c) {

function updateSubcardsInModal(c) { const box = $('#subcardsList'); if (box) box.innerHTML = renderSubcards(c); }
function addSubcard(cardId) {

}
function toggleSubcard(cardId, subId, concluido) {
  const b = currentBoard(), c = b && b.aplicacaocard.find(x => x.id == cardId);
  const sc = c && (c.subcards || []).find(x => x.id == subId);
  if (!sc) return;
  sc.status = concluido ? 'concluido' : 'pendente';
  save('cards'); updateSubcardsInModal(c);
  showToast(concluido ? 'Subcard concluído.' : 'Subcard voltou para pendente.');
}
function deleteSubcard(cardId, subId) {
  const b = currentBoard(), c = b && b.aplicacaocard.find(x => x.id == cardId);
  if (!c) return;
  c.subcards = (c.subcards || []).filter(x => x.id != subId);

function saveCard(id) {
  if (!$('#k1').value.trim()) return;
  const b = currentBoard();
  if (!b) return;
  const c = b.aplicacaocard.find(x => x.id == id) || { id: Date.now(), empresa: ME.empresa, data: now() };
  const avaliadorAntigo = c.emailavaliador || '';
  if (c.status && c.status != $('#k5').value) delete c.ordem;
  Object.assign(c, { cardnome: $('#k1').value, descricao: $('#k2').value, emailautor: $('#k3').value,
    emailavaliador: $('#k4').value, status: $('#k5').value, prioridade: +$('#k6').value, prazo: $('#k7').value });
  if (c.status == 'FINALIZADO') c.dataconclusao = now(); else delete c.arquivado;
  if (!id) b.aplicacaocard.push(c);
  if (c.emailavaliador && !sameEmail(c.emailavaliador, avaliadorAntigo) && !sameEmail(c.emailavaliador, ME.email))
    pushNotification({ tipo: 'avaliador_card', destinoEmail: c.emailavaliador, titulo: 'Você é avaliador de um card',
      mensagem: `${ME.nome} definiu você como avaliador do card "${c.cardnome}" no board "${b.board}".` });

  showToast('Card salvo!');
}
function deleteCard(id) {

let SHOW_DONE_GOALS = false;
const sameEmail = (a, b) => String(a || '').trim().toLowerCase() == String(b || '').trim().toLowerCase();
const canSeeGoal = m => sameEmail(m.autor, ME.email) || m.usuarios.some(u => sameEmail(u.email, ME.email));

const ideiasImplantadas = camp => companyIdeas().filter(i => i.programaideia == camp && i.status == 'implantada').length;
const goalPct = m => m.campanha && m.alvo > 0
  ? Math.min(100, Math.round(ideiasImplantadas(m.campanha) * 100 / m.alvo))
  : m.porcentagemConclusao;
const goalAtrasada = m => goalPct(m) < 100 && !!m.dataPrevisaoConclusao && parseDate(m.dataPrevisaoConclusao) < new Date();

function viewGoals() {
  const lista = DB.metas.map((m, k) => ({ m, k }))

    ${lista.map(x => goalCard(x.m, x.k)).join('') || '<div class="box">Nenhuma meta ativa.</div>'}
  </div></div>`;
}

function goalCard(m, k) {
  const pct = goalPct(m), atras = goalAtrasada(m);
  return `
  <div class="box idea${atras ? ' late' : ''}">
    <h3>${esc(m.meta)} <span class="badge ${pct >= 100 ? 's-implantada' : 's-implantacao'}">${pct}%</span>${atras ? ' <span class="badge late">⏰ Prazo vencido</span>' : ''}</h3>
    <div class="pbar"><div style="width:${pct}%"></div></div>
    ${m.campanha ? `<div class="meta">🎯 Programa de ideia: ${esc(m.campanha)} · ${ideiasImplantadas(m.campanha)} de ${m.alvo} ideia(s) implantada(s)</div>` : ''}
    <div class="meta userline">${avatarHtml(getUser(m.autor).nome)}<span>Criada por ${esc(getUser(m.autor).nome)} em ${esc(m.dataCriacao)} · Previsão de conclusão: ${esc(m.dataPrevisaoConclusao)}</span></div>
    <div class="meta userline"><span>Usuários:</span><span>${m.usuarios.map(u => `${avatarHtml(getUser(u.email).nome, 24)}${esc(getUser(u.email).nome)}`).join(' ') || '-'}</span></div>
    ${m.submeta.map((x, j) => `
      <label style="display:flex;align-items:center;gap:6px;color:var(--fg);font-size:.95rem;padding:3px 0;cursor:pointer">
        <input type="checkbox" style="margin:0" ${x.concluida ? 'checked' : ''} onchange="toggleSubgoal(${k},${j},this.checked)">
        <span style="${x.concluida ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(x.descricao)}</span>
        ${x.responsavel ? `<small class="userline" style="color:var(--mut)">· Responsável: ${avatarHtml(getUser(x.responsavel).nome, 22)}${esc(getUser(x.responsavel).nome)}</small>` : ''}
      </label>`).join('')}
    ${isApprover() ? `<br><button class="btn s r" onclick="deleteGoal(${k})">Excluir</button>` : ''}

function toggleSubgoal(k, j, val) {
  const m = DB.metas[k];
  if (!m || !m.submeta[j] || !canSeeGoal(m)) return;
  const sub = m.submeta[j], antes = sub.concluida;
  sub.concluida = !!val;
  if (sub.concluida) sub.concluidaPor = ME.email; else delete sub.concluidaPor;
  m.porcentagemConclusao = metaPct(m.submeta);
  if (sub.concluida && !antes) {
    const dest = [...new Set([m.autor, sub.responsavel].filter(e => e && !sameEmail(e, ME.email)))];
    pushNotifications(dest.map(e => ({ tipo: 'submeta_concluida', destinoEmail: e, titulo: 'Submeta concluída',
      mensagem: `${ME.nome} concluiu a submeta "${sub.descricao}" da meta "${m.meta}".` })));
  }
  save('metas'); render();
  if (goalPct(m) == 100) showToast('Meta concluída!');
}

function saveGoal() {
  const meta = $('#m1').value.trim(), prev = $('#m2').value;
  const camp = $('#m3').value, alvo = parseInt($('#m4').value, 10) || 0;
  const subs = [...document.querySelectorAll('#msubs .row')]
    .map(r => ({ descricao: r.querySelector('.sg').value.trim(), concluida: false, responsavel: r.querySelector('.sgr').value }))
    .filter(x => x.descricao);
  const marcados = [...document.querySelectorAll('#musers input:checked')].map(x => x.value);
  const users = [...new Set([...marcados, ...subs.map(x => x.responsavel).filter(Boolean)])];
  const erro = t => { $('#mm').textContent = t; };
  if (!meta) return erro('Informe a meta.');
  if (!prev) return erro('Informe a previsão de conclusão.');
  if (camp && alvo < 1) return erro('Informe quantas ideias devem ser implantadas.');
  if (!camp && !subs.length) return erro('Cadastre ao menos uma submeta.');
  const [y, mo, d] = prev.split('-');
  DB.metas.push({
    meta,
    campanha: camp,
    alvo: camp ? alvo : 0,
    dataPrevisaoConclusao: `${d}-${mo}-${y} 23:59`,
    dataCriacao: now(),
    porcentagemConclusao: 0,
    avisoVencida: '',
    autor: ME.email,
    submeta: subs,
    usuarios: users.map(email => ({ email }))
  });
  save('metas'); closeM(); render();
  showToast('Meta cadastrada!');
}

function deleteGoal(k) {
  const m = DB.metas[k];
  if (!m || !isApprover()) return;
  const key = SYNC.metas.key(m);
  showConfirm(`Deseja realmente excluir a meta "${m.meta}"?`, () => {
    const at = DB.metas.findIndex(x => SYNC.metas.key(x) == key);
    if (at < 0) return;
    DB.metas.splice(at, 1);
    save('metas'); render();
    showToast('Meta excluída!');
  });
}

async function refreshNotifs() {
  try { const l = await loadTable('notificacoes'); if (l) DB.notificacoes = l; } catch (e) { }
}

let notifQueue = Promise.resolve();
function pushNotifications(lista) {
  if (!lista || !lista.length) return Promise.resolve();
  notifQueue = notifQueue.then(async () => {
    try {
      const list = (await loadTable('notificacoes')) || DB.notificacoes || [];
      const base = Date.now();
      lista.forEach((n, k) => list.push({ id: base + k, data: now(), lida: false, ...n }));
      DB.notificacoes = list;
      await writeTable('notificacoes');
    } catch (e) { console.warn('Erro ao disparar notificação:', e); }
  });
  return notifQueue;
}
const pushNotification = notifObj => pushNotifications([notifObj]);

/* lembrete de avaliação atrasada (ao aprovador) e aviso de meta vencida (autor e usuários) */
function checkPrazos() {
  if (!ME || !DB.ideias) return;
  const notifs = [];
  let mudouI = false, mudouM = false;

  companyIdeas().forEach(i => {
    if (!sameEmail(i.emailaprovador, ME.email) || !ideaAtrasada(i)) return;
    if (i.ultimoLembrete && diasDesde(i.ultimoLembrete) < PRAZO_AVALIACAO_DIAS) return;
    i.ultimoLembrete = now(); mudouI = true;
    notifs.push({ tipo: 'prazo_avaliacao', destinoEmail: ME.email, titulo: 'Ideia aguardando sua avaliação',
      mensagem: `A ideia "${i.titulo}" está há ${Math.floor(diasDesde(ultimaMov(i)))} dias sem avaliação (prazo de ${PRAZO_AVALIACAO_DIAS} dias).`, idideia: i.id });
  });

  DB.metas.forEach(m => {
    if (!canSeeGoal(m) || !goalAtrasada(m) || m.avisoVencida) return;
    m.avisoVencida = now(); mudouM = true;
    const dest = [...new Set([m.autor, ...m.usuarios.map(u => u.email)].map(e => String(e || '').trim()).filter(Boolean))];
    dest.forEach(e => notifs.push({ tipo: 'meta_vencida', destinoEmail: e, titulo: 'Meta com prazo vencido',
      mensagem: `A meta "${m.meta}" passou do prazo (${String(m.dataPrevisaoConclusao).slice(0, 10)}) e ainda não foi concluída.` }));
  });

  if (mudouI) save('ideias');
  if (mudouM) save('metas');
  if (notifs.length) {
    pushNotifications(notifs).then(() => { updateMenuBadge(); if (VIEW == 'notificacoes') render(); });
    if (notifs.some(n => n.destinoEmail == ME.email))
      showToast('Você tem novos avisos de prazo nas notificações.', 'warning');
  }
}

const userNotifs = () => (DB.notificacoes || []).filter(n =>

);

const pendingResets = () => (DB.notificacoes || []).filter(n => n.tipo == 'recuperar_senha' && n.status == 'pendente' &&

    <h2>Solicitações de senha</h2>
    <p class="meta">Quando alguém esquece a senha, você pode enviar a ela um e-mail para criar uma nova senha.</p>
    <button class="btn s o" onclick="refreshNotifs().then(render)">↻ Atualizar</button><br><br>
    ${list.map(n => `
      <div class="box idea"><h3>${esc(getUser(n.emailusuario).nome)}</h3>
        <p>${esc(n.emailusuario)}</p><div class="meta">Solicitado em ${esc(n.data)}</div>
        <button class="btn s" onclick="openResetForm(${n.id})">Enviar e-mail de redefinição</button>
        <button class="btn s o" onclick="dismissReset(${n.id})">Dispensar</button>
      </div>`).join('') || '<div class="box">Nenhuma solicitação pendente.</div>'}
  </div></div>`;
}

function randomPassword(len = 8) {
  const abc = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return [...crypto.getRandomValues(new Uint32Array(len))].map(n => abc[n % abc.length]).join('');
}

function openResetForm(id) {
  const n = DB.notificacoes.find(x => x.id == id);
  if (!n) return;
  openModal(`
    <h3>Redefinir senha de ${esc(getUser(n.emailusuario).nome)}</h3>
    <p class="meta">${esc(n.emailusuario)}</p><br>
    <p class="meta">A pessoa receberá um e-mail com um link para criar uma nova senha.</p>
    <p class="msg" id="nm"></p>
    <button class="btn" id="nbtn" onclick="resolveReset(${id})">Enviar e-mail de redefinição</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>`);
}

async function closeNotif(id, status) {
  await refreshNotifs();
  const n = DB.notificacoes.find(x => x.id == id);
  if (!n || n.status != 'pendente') throw new Error('Esta solicitação já foi tratada por outra pessoa.');
  Object.assign(n, { status, dataatendimento: now(), atendidopor: ME.email });
  await writeTable('notificacoes');
}

async function dismissReset(id) {
  showConfirm('Dispensar esta solicitação sem alterar a senha?', async () => {
    try { 
      await closeNotif(id, 'dispensada'); 
      showToast('Solicitação dispensada.');
    } catch (e) { 
      showToast(e.message || 'Falha ao dispensar.', 'warning'); 
    }
    render();
  });
}

/* ========================== 14. INICIALIZAÇÃO =========================== */
(async () => {
  const hash = location.hash;
  if (hash == '#empresa') return renderCompanyPage();
  if (hash == '#termos' || hash == '#privacidade' || hash == '#lgpd') return renderDocPage('Termos, Privacidade e LGPD', DOC_UNIFICADO);

  document.body.innerHTML = '<div class="login"><p>Carregando...</p></div>';
  DB.usuarios = [];
  savedLogin.purgeLegacy();

  /* sessão do Firebase Authentication (se já estiver logado neste navegador) */
  let fbUser = await new Promise(res => { const off = fb.auth.onAuthStateChanged(u => { off(); res(u); }); });
  let expirou = false;
  if (fbUser && sessaoExpirada()) { try { await fb.auth.signOut(); } catch (e) { } loginTsClear(); fbUser = null; expirou = true; }
  if (fbUser) {
    try {
      const pf = (await fb.db.ref('perfis/' + fbUser.uid).get()).val();
      if (pf && pf.perfil == 'superadmin' && pf.ativo !== false) return adminHome('painel');
      if (hash == '#admin') { try { await fb.auth.signOut(); } catch (e) { } return renderAdminLogin(); }
      const r = await montarSessao(fbUser);
      if (r.user) { ME = r.user; return startApp(); }
    } catch (e) { limparSegredos(); }
  }
  if (hash == '#admin') { renderAdminLogin(); if (expirou) $('#am').textContent = SESSAO_MSG; return; }
  renderLogin();
  if (expirou) $('#lm').textContent = SESSAO_MSG;
})();
</script>
